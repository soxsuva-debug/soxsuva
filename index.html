<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>soxsuva</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: -35px;
    z-index: -20;

    background:
        linear-gradient(
            rgba(0,0,0,.42),
            rgba(0,0,0,.88)
        ),
        url("banner.gif") center / cover no-repeat;

    filter: blur(16px);
    transform: scale(1.08);
}

/* =========================================================
   CHERRY BLOSSOMS
========================================================= */

.blossoms {
    position: fixed;
    inset: 0;

    pointer-events: none;
    overflow: hidden;

    z-index: 9000;
}

.blossom {
    position: absolute;
    top: -30px;

    width: 8px;
    height: 6px;

    background: #fff;

    border-radius: 70% 30% 70% 30%;

    opacity: .72;

    box-shadow:
        0 0 7px rgba(255,255,255,.5);

    animation:
        blossomFall
        var(--fall-time)
        linear
        var(--delay)
        infinite;

    will-change: transform;
}

@keyframes blossomFall {

    0% {
        transform:
            translate3d(0,-30px,0)
            rotate(0deg);
    }

    25% {
        transform:
            translate3d(var(--x1),25vh,0)
            rotate(90deg);
    }

    50% {
        transform:
            translate3d(var(--x2),50vh,0)
            rotate(180deg);
    }

    75% {
        transform:
            translate3d(var(--x3),75vh,0)
            rotate(270deg);
    }

    100% {
        transform:
            translate3d(var(--x4),110vh,0)
            rotate(360deg);
    }
}

/* =========================================================
   CLICK TO ENTER
========================================================= */

#enterScreen {
    position: fixed;
    inset: 0;

    z-index: 100000;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    cursor: pointer;

    background: #000;

    opacity: 1;

    transition:
        opacity 300ms ease;
}

#enterBanner {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    filter: brightness(.58);
}

.enter-dark {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.72)
        );
}

.enter-vignette {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle,
            transparent 10%,
            rgba(0,0,0,.78) 100%
        );
}

.enter-content {
    position: relative;
    z-index: 5;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

#enterPfp {
    display: block;

    width: 145px;
    height: 145px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,.95);

    box-shadow:
        0 0 35px rgba(255,255,255,.24),
        0 0 100px rgba(255,255,255,.08);
}

.enter-name {
    margin-top: 20px;

    font-size:
        clamp(50px, 9vw, 82px);

    font-weight: 900;

    letter-spacing: -4px;

    text-shadow:
        0 0 30px rgba(255,255,255,.2);

    transition:
        opacity 300ms ease,
        transform 400ms cubic-bezier(.16,1,.3,1);
}

.enter-text {
    margin-top: 12px;

    font-size: 10px;

    letter-spacing: 3px;

    color: rgba(255,255,255,.62);

    animation:
        enterPulse
        2s
        ease-in-out
        infinite;

    transition:
        opacity 250ms ease,
        transform 350ms ease;
}

@keyframes enterPulse {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }
}

/* =========================================================
   FLYING PFP
========================================================= */

.pfp-flyer {
    position: fixed;

    z-index: 100001;

    margin: 0;

    object-fit: cover;

    border-radius: 50%;

    pointer-events: none;

    will-change:
        left,
        top,
        width,
        height;

    transition:
        left 900ms cubic-bezier(.16,1,.3,1),
        top 900ms cubic-bezier(.16,1,.3,1),
        width 900ms cubic-bezier(.16,1,.3,1),
        height 900ms cubic-bezier(.16,1,.3,1),
        border-radius 900ms cubic-bezier(.16,1,.3,1),
        border-width 900ms cubic-bezier(.16,1,.3,1),
        box-shadow 900ms cubic-bezier(.16,1,.3,1);
}

/* =========================================================
   MAIN PAGE
========================================================= */

.page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 14px;
}

.card {
    width: min(570px,100%);

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 27px;

    background:
        rgba(8,8,10,.70);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 35px 120px rgba(0,0,0,.75),
        inset 0 1px rgba(255,255,255,.05);
}

/* =========================================================
   MAIN BANNER
========================================================= */

.banner {
    position: relative;

    width: 100%;
    height: 200px;

    overflow: hidden;
}

#mainBanner {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.banner-shade {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            transparent 25%,
            rgba(0,0,0,.6)
        );
}

/* =========================================================
   PROFILE AREA
========================================================= */

.profile-area {
    position: relative;

    padding:
        70px 27px 28px;
}

.profile {
    text-align: center;
}

/* =========================================================
   MAIN PFP
   HIDDEN FROM FIRST PAINT
========================================================= */

.pfp-wrap {
    position: absolute;

    left: 50%;
    top: -62px;

    width: 124px;
    height: 124px;

    transform:
        translateX(-50%);

    z-index: 20;
}

/*
   IMPORTANT:
   opacity AND visibility are set here in CSS,
   not only through JavaScript.

   This means the browser cannot briefly render
   the main PFP underneath the flying PFP.
*/

#profilePfp {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 50%;

    border: 4px solid #111;

    background: #111;

    box-shadow:
        0 12px 35px rgba(0,0,0,.7);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 120ms ease,
        visibility 0s linear 120ms;
}

/* =========================================================
   DISCORD STATUS
========================================================= */

.discord-status {
    position: absolute;

    right: 2px;
    bottom: 2px;

    width: 31px;
    height: 31px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #111;

    box-shadow:
        0 0 0 3px #111;
}

.discord-status::after {
    content: "";

    width: 17px;
    height: 17px;

    border-radius: 50%;

    background: #747f8d;
}

.discord-status.online::after {
    background: #23a55a;
}

.discord-status.idle::after {
    background: #f0b232;
}

.discord-status.dnd::after {
    width: 17px;
    height: 17px;

    background: #ed4245;
}

.discord-status.dnd::before {
    content: "";

    position: absolute;

    width: 9px;
    height: 3px;

    border-radius: 3px;

    background: #111;
}

.discord-status.offline::after {
    background: #747f8d;
}

/* =========================================================
   PROFILE TEXT
========================================================= */

.name {
    font-size: 32px;

    font-weight: 900;

    letter-spacing: -1.5px;
}

.username {
    margin-top: 5px;

    color: rgba(255,255,255,.52);

    font-size: 13px;
}

.bio {
    max-width: 410px;

    margin:
        14px auto 0;

    color: #d0d0d0;

    font-size: 14px;

    line-height: 1.55;
}

/* =========================================================
   BADGES
========================================================= */

.badges {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    margin-top: 15px;
}

.badge {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 8px;

    background:
        rgba(255,255,255,.045);

    transition:
        transform 200ms ease,
        background 200ms ease,
        box-shadow 200ms ease;
}

.badge:hover {
    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.09);

    box-shadow:
        0 0 15px rgba(255,255,255,.1);
}

.badge svg {
    width: 18px;
    height: 18px;
}

/* =========================================================
   TIKTOK
========================================================= */

.tiktok {
    display: block;

    margin-top: 24px;

    padding: 15px;

    color: #fff;

    text-decoration: none;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 17px;

    background:
        rgba(255,255,255,.035);

    transition:
        transform 250ms ease,
        border-color 250ms ease,
        background 250ms ease,
        box-shadow 250ms ease;
}

.tiktok:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(255,255,255,.4);

    background:
        rgba(255,255,255,.07);

    box-shadow:
        0 0 30px rgba(255,255,255,.1);
}

.tiktok-top {
    display: flex;
    align-items: center;

    gap: 12px;
}

.tiktok-logo {
    width: 44px;
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: #050505;

    border:
        1px solid rgba(255,255,255,.12);
}

.tiktok-logo svg {
    width: 23px;
    height: 23px;
}

.tiktok-info {
    flex: 1;
}

.tiktok-title {
    font-size: 14px;
    font-weight: 900;
}

.tiktok-handle {
    margin-top: 3px;

    color: #777;

    font-size: 11px;
}

.tiktok-arrow {
    color: #777;

    font-size: 18px;

    transition:
        transform 200ms ease,
        color 200ms ease;
}

.tiktok:hover .tiktok-arrow {
    color: #fff;

    transform:
        translateX(4px);
}

.tiktok-stats {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    margin-top: 14px;

    padding-top: 14px;

    border-top:
        1px solid rgba(255,255,255,.1);
}

.stat {
    text-align: center;
}

.stat-number {
    font-size: 16px;

    font-weight: 900;
}

.stat-label {
    margin-top: 4px;

    color: #777;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

/* =========================================================
   SECTION TITLES
========================================================= */

.section-title {
    margin:
        25px 0 10px;

    color: #777;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1.7px;

    text-transform: uppercase;
}

/* =========================================================
   ACTIVITY
========================================================= */

.activity {
    display: flex;
    align-items: center;

    gap: 12px;

    min-height: 72px;

    padding: 12px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 16px;

    background:
        rgba(255,255,255,.035);

    transition:
        border-color 250ms ease,
        box-shadow 250ms ease;
}

.activity:hover {
    border-color:
        rgba(255,255,255,.28);

    box-shadow:
        0 0 25px rgba(255,255,255,.06);
}

.activity-art {
    width: 49px;
    height: 49px;

    flex-shrink: 0;

    border-radius: 11px;

    object-fit: cover;

    background: #111;
}

.activity-info {
    min-width: 0;

    flex: 1;
}

.activity-type {
    margin-bottom: 4px;

    color: #777;

    font-size: 10px;
}

.activity-title {
    overflow: hidden;

    font-size: 14px;

    font-weight: 800;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.activity-details {
    margin-top: 4px;

    overflow: hidden;

    color: #999;

    font-size: 11px;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.activity-empty {
    justify-content: center;

    color: #777;

    font-size: 12px;
}

/* =========================================================
   MUSIC
========================================================= */

.music {
    padding: 16px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 18px;

    background:
        rgba(255,255,255,.035);
}

.music-top {
    display: flex;
    align-items: center;

    gap: 13px;
}

.album {
    width: 55px;
    height: 55px;

    object-fit: cover;

    border-radius: 12px;
}

.music-info {
    flex: 1;

    min-width: 0;
}

.music-title {
    font-size: 14px;

    font-weight: 900;
}

.music-artist {
    margin-top: 4px;

    color: #999;

    font-size: 11px;
}

.music-status {
    color: #777;

    font-size: 10px;
}

.music-player {
    display: flex;
    align-items: center;

    gap: 10px;

    margin-top: 14px;
}

.play-button {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;

    border-radius: 50%;

    background: #fff;

    color: #000;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;

    transition:
        transform 200ms ease,
        box-shadow 200ms ease;
}

.play-button:hover {
    transform:
        scale(1.07);

    box-shadow:
        0 0 20px rgba(255,255,255,.2);
}

.progress-area {
    flex: 1;
}

.progress {
    width: 100%;
    height: 5px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.13);

    cursor: pointer;
}

.progress-fill {
    width: 0%;
    height: 100%;

    border-radius: 20px;

    background: #fff;

    transition:
        width 100ms linear;
}

.time {
    display: flex;
    justify-content: space-between;

    margin-top: 6px;

    color: #666;

    font-size: 9px;
}

audio {
    display: none;
}

/* =========================================================
   SOCIALS
========================================================= */

.socials {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 9px;
}

.social {
    min-height: 88px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    color: #fff;

    text-decoration: none;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 16px;

    background:
        rgba(255,255,255,.035);

    transition:
        transform 250ms ease,
        border-color 250ms ease,
        background 250ms ease,
        box-shadow 250ms ease;
}

.social:hover {
    transform:
        translateY(-4px);

    border-color:
        rgba(255,255,255,.4);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 0 30px rgba(255,255,255,.11);
}

.social-name {
    font-size: 11px;

    font-weight: 800;
}

.social-user {
    margin-top: 5px;

    color: #777;

    font-size: 9px;
}

/* =========================================================
   COUNTERS
========================================================= */

.counters {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 20px;
}

.counter {
    padding:
        9px 13px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 11px;

    background:
        rgba(255,255,255,.035);

    color: #888;

    font-size: 10px;
}

.counter strong {
    color: #fff;
}

.like-button {
    cursor: pointer;

    font-family: inherit;

    transition:
        background 200ms ease,
        border-color 200ms ease;
}

.like-button:hover {
    background:
        rgba(255,255,255,.07);

    border-color:
        rgba(255,255,255,.3);
}

.like-button.liked {
    background:
        rgba(255,255,255,.1);

    border-color:
        rgba(255,255,255,.35);
}

.like-button:disabled {
    cursor: default;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 560px) {

    .page {
        padding: 10px;
    }

    .card {
        border-radius: 23px;
    }

    .banner {
        height: 165px;
    }

    .profile-area {
        padding:
            68px 16px 22px;
    }

    .pfp-wrap {
        width: 110px;
        height: 110px;

        top: -55px;
    }

    .discord-status {
        width: 28px;
        height: 28px;
    }

    .discord-status::after {
        width: 15px;
        height: 15px;
    }

    .name {
        font-size: 28px;
    }

    .socials {
        grid-template-columns: 1fr;
    }

    .social {
        min-height: 66px;

        flex-direction: row;

        justify-content: flex-start;

        padding: 13px;
    }

    .social-name {
        margin-left: 0;
    }

    .social-user {
        margin-top: 3px;
        margin-left: 8px;
    }
}

@media (prefers-reduced-motion: reduce) {

    .blossom {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="background"></div>

<!-- =========================================================
     CHERRY BLOSSOMS
========================================================= -->

<div
    class="blossoms"
    id="blossoms"
></div>

<!-- =========================================================
     CLICK TO ENTER
========================================================= -->

<div id="enterScreen">

    <img
        id="enterBanner"
        src="banner.gif"
        alt=""
    >

    <div class="enter-dark"></div>

    <div class="enter-vignette"></div>

    <div class="enter-content">

        <img
            id="enterPfp"
            src="pfp.jpeg"
            alt="soxsuva"
        >

        <div class="enter-name">

        </div>

        <div class="enter-text">
            CLICK TO ENTER
        </div>

    </div>

</div>

<!-- =========================================================
     MAIN SITE
========================================================= -->

<main class="page">

<section class="card">

    <div class="banner">

        <img
            id="mainBanner"
            src="banner.gif"
            alt=""
        >

        <div class="banner-shade"></div>

    </div>

    <div class="profile-area">

        <div class="profile">

            <div class="pfp-wrap">

                <img
                    id="profilePfp"

                >

                <div
                    id="discordStatus"

                    title="Offline"
                ></div>

            </div>

            <div
                class="name"
                id="displayName"

            </div>

                    </svg>

                <div

                    <svg viewBox="0 0 24 24" fill="none">

                            d="M7 4h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-4l-3.5 3V17H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"
                            fill="white"
                        />
                        <path
                            d="m8 11 2.3 2.2L16 7.8"

                        <circle
                            cx="12"

                        <circle

                    </svg>
                </div>

            </div>

        </div>

        <!-- =================================================

        <a

        >

            <div class="tiktok-top">

                <div class="tiktok-logo">

                    <svg

                        fill="none"
                    >

<script>

/* =========================================================
   CHERRY BLOSSOMS
========================================================= */

const blossomContainer =
    document.getElementById("blossoms");

for (let i = 0; i < 24; i++) {

    const blossom =
        document.createElement("div");

    blossom.className =
        "blossom";

    blossom.style.left =
        (Math.random() * 100) + "%";

    blossom.style.setProperty(
        "--fall-time",
        (12 + Math.random() * 9) + "s"
    );

    blossom.style.setProperty(
        "--delay",
        (-Math.random() * 15) + "s"
    );

    blossom.style.setProperty(
        "--x1",
        (-30 + Math.random() * 60) + "px"
    );

    blossom.style.setProperty(
        "--x2",
        (-60 + Math.random() * 120) + "px"
    );

    blossom.style.setProperty(
        "--x3",
        (-40 + Math.random() * 80) + "px"
    );

    blossom.style.setProperty(
        "--x4",
        (-80 + Math.random() * 160) + "px"
    );

    const size =
        5 + Math.random() * 5;

    blossom.style.width =
        size + "px";

    blossom.style.height =
        (size * .72) + "px";

    blossomContainer.appendChild(
        blossom
    );
}


/* =========================================================
   DISCORD / LANYARD
========================================================= */

const DISCORD_ID =
    "1491533148914450614";

async function updateDiscord() {

    try {

        const response =
            await fetch(
                "https://api.lanyard.rest/v1/users/" +
                DISCORD_ID
            );

        const json =
            await response.json();

        if (
            !json.success ||
            !json.data
        ) {
            throw new Error(
                "Discord unavailable"
            );
        }

        const data =
            json.data;

        const status =
            data.discord_status ||
            "offline";

        const statusElement =
            document.getElementById(
                "discordStatus"
            );

        statusElement.className =
            "discord-status " +
            status;

        statusElement.title =
            status === "dnd"
                ? "Do Not Disturb"
                : status.charAt(0).toUpperCase()
                    + status.slice(1);

        updateActivity(data);

    } catch (error) {

        const statusElement =
            document.getElementById(
                "discordStatus"
            );

        statusElement.className =
            "discord-status offline";

        statusElement.title =
            "Offline";

        const activity =
            document.getElementById(
                "activity"
            );

        activity.className =
            "activity activity-empty";

        activity.textContent =
            "No activity right now";
    }
}


/* =========================================================
   ACTIVITY
========================================================= */

function updateActivity(data) {

    const activity =
        document.getElementById(
            "activity"
        );

    if (
        data.listening_to_spotify &&
        data.spotify
    ) {

        const spotify =
            data.spotify;

        activity.className =
            "activity";

        activity.innerHTML = `

            <img
                class="activity-art"
                src="${escapeHTML(
                    spotify.album_art_url
                )}"
                alt=""
            >

            <div class="activity-info">

                <div class="activity-type">
                    🎵 Listening on Spotify
                </div>

                <div class="activity-title">
                    ${escapeHTML(
                        spotify.song
                    )}
                </div>

                <div class="activity-details">
                    ${escapeHTML(
                        spotify.artist
                    )}
                </div>

            </div>
        `;

        return;
    }

    if (
        data.activities &&
        data.activities.length
    ) {

        const game =
            data.activities.find(
                item =>
                    item.type !== 4
            );

        if (game) {

            activity.className =
                "activity";

            activity.innerHTML = `

                <div
                    class="activity-art"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:21px;
                    "
                >
                    🎮
                </div>

                <div class="activity-info">

                    <div class="activity-type">
                        🎮 Playing
                    </div>

                    <div class="activity-title">
                        ${escapeHTML(
                            game.name
                        )}
                    </div>

                    <div class="activity-details">
                        ${escapeHTML(
                            game.details ||
                            game.state ||
                            ""
                        )}
                    </div>

                </div>
            `;

            return;
        }
    }

    activity.className =
        "activity activity-empty";

    activity.textContent =
        "No activity right now";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   MUSIC
========================================================= */

const audio =
    document.getElementById(
        "audio"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const progress =
    document.getElementById(
        "progress"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );

const musicStatus =
    document.getElementById(
        "musicStatus"
    );

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds)
    ) {
        return "0:00";
    }

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2,"0");

    return (
        minutes +
        ":" +
        secs
    );
}

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }

        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        progressFill.style.width =
            percent + "%";

        currentTime.textContent =
            formatTime(
                audio.currentTime
            );
    }
);

audio.addEventListener(
    "play",
    () => {

        playButton.textContent =
            "❚❚";

        musicStatus.textContent =
            "Playing";
    }
);

audio.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶";

        musicStatus.textContent =
            "Paused";
    }
);

playButton.addEventListener(
    "click",
    () => {

        if (audio.paused) {

            audio.play().catch(
                () => {}
            );

        } else {

            audio.pause();

        }
    }
);

progress.addEventListener(
    "click",
    event => {

        if (!audio.duration) {
            return;
        }

        const rect =
            progress.getBoundingClientRect();

        const percent =
            (
                event.clientX -
                rect.left
            ) / rect.width;

        audio.currentTime =
            percent *
            audio.duration;
    }
);


/* =========================================================
   CLICK TO ENTER + PFP FLIGHT
========================================================= */

const enterScreen =
    document.getElementById(
        "enterScreen"
    );

const enterPfp =
    document.getElementById(
        "enterPfp"
    );

const mainPfp =
    document.getElementById(
        "profilePfp"
    );

let hasEntered =
    false;


/*
   Keep the main PFP completely invisible
   before the animation begins.
*/

mainPfp.style.opacity = "0";
mainPfp.style.visibility = "hidden";


enterScreen.addEventListener(
    "click",
    () => {

        if (hasEntered) {
            return;
        }

        hasEntered = true;


        /* Start music */

        audio.play().catch(
            () => {}
        );


        /*
           Get starting position BEFORE
           removing the enter screen.
        */

        const start =
            enterPfp.getBoundingClientRect();


        /*
           Get destination position.
        */

        const destination =
            mainPfp.getBoundingClientRect();


        /*
           Create the ONLY visible PFP
           during the transition.
        */

        const flyer =
            document.createElement("img");

        flyer.src =
            enterPfp.currentSrc ||
            enterPfp.src;

        flyer.className =
            "pfp-flyer";


        flyer.style.left =
            start.left + "px";

        flyer.style.top =
            start.top + "px";

        flyer.style.width =
            start.width + "px";

        flyer.style.height =
            start.height + "px";

        flyer.style.borderRadius =
            "50%";

        flyer.style.border =
            getComputedStyle(
                enterPfp
            ).border;

        flyer.style.boxShadow =
            getComputedStyle(
                enterPfp
            ).boxShadow;


        document.body.appendChild(
            flyer
        );


        /*
           Hide the ENTER text.
        */

        const enterName =
            enterScreen.querySelector(
                ".enter-name"
            );

        const enterText =
            enterScreen.querySelector(
                ".enter-text"
            );

        enterName.style.opacity =
            "0";

        enterName.style.transform =
            "translateY(-12px)";

        enterText.style.opacity =
            "0";

        enterText.style.transform =
            "translateY(-8px)";


        /*
           Force browser layout.
        */

        flyer.getBoundingClientRect();


        /*
           Fly into the main PFP.
        */

        requestAnimationFrame(
            () => {

                flyer.style.left =
                    destination.left +
                    "px";

                flyer.style.top =
                    destination.top +
                    "px";

                flyer.style.width =
                    destination.width +
                    "px";

                flyer.style.height =
                    destination.height +
                    "px";

                flyer.style.borderRadius =
                    getComputedStyle(
                        mainPfp
                    ).borderRadius;

                flyer.style.borderWidth =
                    getComputedStyle(
                        mainPfp
                    ).borderWidth;

                flyer.style.boxShadow =
                    getComputedStyle(
                        mainPfp
                    ).boxShadow;
            }
        );


        /*
           Fade the enter screen away
           while the PFP is travelling.
        */

        setTimeout(
            () => {

                enterScreen.style.opacity =
                    "0";

            },
            650
        );


        /*
           The flying PFP reaches the
           destination at approximately 900ms.

           ONLY THEN do we reveal the real PFP.
        */

        setTimeout(
            () => {

                mainPfp.style.opacity =
                    "1";

                mainPfp.style.visibility =
                    "visible";


                /*
                   Remove enter screen.
                */

                enterScreen.style.display =
                    "none";


                /*
                   Remove flying copy AFTER
                   real PFP is visible.
                */

                flyer.remove();

            },
            930
        );

    }
);


/* =========================================================
   VIEW COUNTER
========================================================= */

const viewKey =
    "soxsuva_viewed_v4";

let views =
    Number(
        localStorage.getItem(
            "soxsuva_views_v4"
        )
    ) || 0;

if (
    !localStorage.getItem(
        viewKey
    )
) {

    views++;

    localStorage.setItem(
        "soxsuva_views_v4",
        views
    );

    localStorage.setItem(
        viewKey,
        "true"
    );
}

document.getElementById(
    "views"
).textContent =
    views;


/* =========================================================
   LIKE COUNTER
========================================================= */

const likeKey =
    "soxsuva_liked_v4";

let likes =
    Number(
        localStorage.getItem(
            "soxsuva_likes_v4"
        )
    ) || 0;

document.getElementById(
    "likes"
).textContent =
    likes;

const likeButton =
    document.getElementById(
        "likeButton"
    );

if (
    localStorage.getItem(
        likeKey
    )
) {

    likeButton.classList.add(
        "liked"
    );

    likeButton.disabled =
        true;
}

likeButton.addEventListener(
    "click",
    () => {

        if (
            localStorage.getItem(
                likeKey
            )
        ) {
            return;
        }

        likes++;

        localStorage.setItem(
            "soxsuva_likes_v4",
            likes
        );

        localStorage.setItem(
            likeKey,
            "true"
        );

        document.getElementById(
            "likes"
        ).textContent =
            likes;

        likeButton.classList.add(
            "liked"
        );

        likeButton.disabled =
            true;
    }
);


/* =========================================================
   START DISCORD
========================================================= */

updateDiscord();

setInterval(
    updateDiscord,
    15000
);

</script>
