<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>soxsuva</title>
    <meta name="description" content="soxsuva">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.58);
            --border: rgba(255, 255, 255, 0.13);
            --glass: rgba(5, 5, 5, 0.68);
        }

        html,
        body {
            min-height: 100%;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* =====================================================
           CLICK TO ENTER
        ===================================================== */

        #enterScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.42),
                    rgba(0, 0, 0, 0.78)
                ),
                url("banner.gif") center / cover no-repeat;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        #enterScreen::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(0, 0, 0, 0.18) 45%,
                    rgba(0, 0, 0, 0.58) 100%
                );

            pointer-events: none;
        }

        #enterScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-content {
            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            transition:
                opacity 0.65s ease,
                transform 0.65s ease;
        }

        #enterPfp {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 50%;

            border: 3px solid rgba(255,255,255,0.92);

            box-shadow:
                0 0 35px rgba(255,255,255,0.18),
                0 0 100px rgba(255,255,255,0.06);

            margin-bottom: 20px;

            will-change: transform;
        }

        .enter-name {
            font-size: clamp(52px, 10vw, 90px);
            font-weight: 900;

            letter-spacing: -4px;

            text-shadow:
                0 0 25px rgba(255,255,255,0.16),
                0 0 70px rgba(255,255,255,0.07);
        }

        .enter-text {
            margin-top: 14px;

            color: rgba(255,255,255,0.68);

            font-size: 13px;
            letter-spacing: 2px;

            animation:
                enterPulse 2s ease-in-out infinite;
        }

        @keyframes enterPulse {
            0%,
            100% {
                opacity: 0.55;
            }

            50% {
                opacity: 1;
            }
        }

        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {
            position: fixed;
            inset: -25px;

            z-index: -5;

            background:
                linear-gradient(
                    rgba(0,0,0,0.48),
                    rgba(0,0,0,0.85)
                ),
                url("banner.gif") center / cover no-repeat;

            filter: blur(4px);
        }

        .background-overlay {
            position: fixed;
            inset: 0;

            z-index: -4;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.04),
                    rgba(0,0,0,0.76)
                );
        }

        /* =====================================================
           MAIN PAGE
        ===================================================== */

        .page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 15px;
        }

        .card {
            width: min(540px, 100%);

            padding: 30px;

            border:
                1px solid var(--border);

            border-radius: 25px;

            background: var(--glass);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 100px rgba(0,0,0,0.6),
                inset 0 1px rgba(255,255,255,0.05);

            animation:
                cardAppear 0.8s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =====================================================
           PROFILE
        ===================================================== */

        .profile {
            text-align: center;
        }

        #profilePfp {
            width: 120px;
            height: 120px;

            object-fit: cover;

            border-radius: 50%;

            border:
                3px solid rgba(255,255,255,0.9);

            box-shadow:
                0 0 35px rgba(255,255,255,0.13);

            transition:
                transform 0.3s ease;

            will-change: transform;
        }

        #profilePfp:hover {
            transform: scale(1.04);
        }

        .name {
            margin-top: 16px;

            font-size: 31px;
            font-weight: 900;

            letter-spacing: -1px;
        }

        .username {
            margin-top: 5px;

            color: var(--muted);

            font-size: 13px;
        }

        .bio {
            max-width: 400px;

            margin:
                18px auto 0;

            color: #d0d0d0;

            font-size: 14px;
            line-height: 1.55;
        }

        /* =====================================================
           SOCIALS
        ===================================================== */

        .socials {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;

            gap: 9px;

            margin-top: 25px;
        }

        .social {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 10px 14px;

            color: white;

            text-decoration: none;

            font-size: 13px;

            border:
                1px solid var(--border);

            border-radius: 11px;

            background:
                rgba(255,255,255,0.045);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .social:hover {
            transform: translateY(-2px);

            background:
                rgba(255,255,255,0.1);

            border-color:
                rgba(255,255,255,0.27);
        }

        .social-icon {
            font-size: 16px;
        }

        /* =====================================================
           STATS
        ===================================================== */

        .stats {
            display: flex;
            justify-content: center;

            gap: 35px;

            margin-top: 25px;
            padding-top: 21px;

            border-top:
                1px solid var(--border);
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 17px;
            font-weight: 800;
        }

        .stat-label {
            margin-top: 4px;

            color: var(--muted);

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        /* =====================================================
           SECTIONS
        ===================================================== */

        .section {
            margin-top: 25px;
        }

        .section-title {
            margin-bottom: 10px;

            color: #999;

            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1.6px;
        }

        /* =====================================================
           ACTIVITY
        ===================================================== */

        .activity {
            min-height: 70px;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 12px;

            border:
                1px solid var(--border);

            border-radius: 15px;

            background:
                rgba(255,255,255,0.035);
        }

        .activity-art {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            object-fit: cover;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.07);
        }

        .activity-info {
            min-width: 0;
            flex: 1;
        }

        .activity-type {
            margin-bottom: 4px;

            color: var(--muted);

            font-size: 10px;
        }

        .activity-title {
            overflow: hidden;

            font-size: 14px;
            font-weight: 800;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .activity-details {
            margin-top: 4px;

            overflow: hidden;

            color: #999;

            font-size: 11px;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .activity-empty {
            justify-content: center;

            color: var(--muted);

            font-size: 12px;
        }

        /* =====================================================
           MUSIC
        ===================================================== */

        .music {
            margin-top: 25px;

            padding: 15px;

            border:
                1px solid var(--border);

            border-radius: 15px;

            background:
                rgba(255,255,255,0.035);
        }

        .music-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 10px;
        }

        .music-name {
            font-size: 13px;
            font-weight: 800;
        }

        .music-status {
            color: var(--muted);

            font-size: 10px;
        }

        audio {
            width: 100%;
            height: 35px;
        }

        /* =====================================================
           COUNTERS
        ===================================================== */

        .counters {
            display: flex;
            justify-content: center;

            gap: 10px;

            margin-top: 20px;
        }

        .counter {
            padding: 8px 12px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background:
                rgba(255,255,255,0.035);

            color: #999;

            font-size: 11px;
        }

        .counter strong {
            color: white;
        }

        /* =====================================================
           ADMIN
        ===================================================== */

        .admin-button {
            display: block;

            margin: 25px auto 0;

            padding: 7px 12px;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background: transparent;

            color: #777;

            font-size: 10px;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .admin-button:hover {
            color: white;

            border-color:
                rgba(255,255,255,0.3);
        }

        .admin-message {
            display: none;

            margin-top: 12px;
            padding: 12px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            color: #999;

            background:
                rgba(255,255,255,0.03);

            font-size: 11px;

            line-height: 1.5;

            text-align: center;
        }

        .admin-message.show {
            display: block;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .page {
                padding: 15px;
            }

            .card {
                padding: 23px 18px;

                border-radius: 20px;
            }

            #profilePfp {
                width: 105px;
                height: 105px;
            }

            .name {
                font-size: 28px;
            }

            .stats {
                gap: 22px;
            }

            .enter-name {
                letter-spacing: -2px;
            }

            #enterPfp {
                width: 125px;
                height: 125px;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         CLICK TO ENTER
    ====================================================== -->

    <div id="enterScreen">

        <div class="enter-content">

            <img
                id="enterPfp"
                src="pfp.jpeg"
                alt="soxsuva"
            >

            <div class="enter-name">
                soxsuva
            </div>

            <div class="enter-text">
                click to enter
            </div>

        </div>

    </div>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background"></div>

    <div class="background-overlay"></div>


    <!-- =====================================================

    ====================================================== -->

    <main class="page">

                    src="pfp.jpeg"
                    alt="soxsuva"

                <h1 class="name">

                </div>

                </p>

            </div>


            <!-- SOCIALS -->

                </a>


                <a
                    class="social"

                <div class="stat">

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           SETTINGS
        ===================================================== */

        const DISCORD_ID =
            "1491533148914450614";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const enterScreen =
            document.getElementById("enterScreen");

        const enterPfp =
            document.getElementById("enterPfp");

        const profilePfp =
            document.getElementById("profilePfp");

        const music =
            document.getElementById("music");

        const musicStatus =
            document.getElementById("musicStatus");


        /* =====================================================
           CLICK TO ENTER PFP MORPH
        ===================================================== */

        enterScreen.addEventListener("click", async () => {

            /*
             * Start music from the user's click.
             */

            try {

                await music.play();

                musicStatus.textContent =
                    "Playing";

            } catch (error) {

                console.log(
                    "Music could not start:",
                    error
                );

                musicStatus.textContent =
                    "Click play";
            }


            /*
             * Get the exact positions of both PFPs.
             */

            const startRect =
                enterPfp.getBoundingClientRect();

            const endRect =
                profilePfp.getBoundingClientRect();


            /*
             * Calculate the movement required
             * to move the entrance PFP directly
             * onto the profile PFP.
             */

            const startCenterX =
                startRect.left +
                startRect.width / 2;

            const startCenterY =
                startRect.top +
                startRect.height / 2;

            const endCenterX =
                endRect.left +
                endRect.width / 2;

            const endCenterY =
                endRect.top +
                endRect.height / 2;


            const moveX =
                endCenterX -
                startCenterX;

            const moveY =
                endCenterY -
                startCenterY;


            /*
             * Calculate the size change.
             */

            const scale =
                endRect.width /
                startRect.width;


            /*
             * Hide the main PFP temporarily so
             * the flying PFP is the only one visible.
             */

            profilePfp.style.opacity = "0";


            /*
             * Disable clicks while animation happens.
             */

            enterScreen.style.pointerEvents =
                "none";


            /*
             * Fade the text away.
             */

            const enterContent =
                document.querySelector(
                    ".enter-content"
                );

            const enterName =
                document.querySelector(
                    ".enter-name"
                );

            const enterText =
                document.querySelector(
                    ".enter-text"
                );


            enterName.style.transition =
                "opacity 0.35s ease";

            enterText.style.transition =
                "opacity 0.3s ease";


            enterName.style.opacity = "0";
            enterText.style.opacity = "0";


            /*
             * Move the PFP.
             */

            enterPfp.style.transition =
                "transform 0.95s cubic-bezier(.16,1,.3,1)";


            enterPfp.style.transform =
                `translate(${moveX}px, ${moveY}px) scale(${scale})`;


            /*
             * After the PFP reaches the profile,
             * fade away the entrance screen.
             */

            setTimeout(() => {

                enterScreen.style.opacity =
                    "0";

            }, 700);


            /*
             * Reveal the real profile PFP at
             * almost the exact same moment.
             */

            setTimeout(() => {

                profilePfp.style.transition =
                    "opacity 0.18s ease";

                profilePfp.style.opacity =
                    "1";

            }, 790);


            /*
             * Completely remove entrance screen.
             */

            setTimeout(() => {

                enterScreen.classList.add(
                    "hidden"
                );

            }, 1000);

        });


        /* =====================================================
           LANYARD / DISCORD ACTIVITY
        ===================================================== */

        async function loadActivity() {

            const activity =
                document.getElementById(
                    "activity"
                );


            try {

                const response =
                    await fetch(
                        `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
                    );


                const result =
                    await response.json();


                if (
                    !result.success ||
                    !result.data
                ) {

                    throw new Error(
                        "No Lanyard data"
                    );

                }


                const data =
                    result.data;


                /* =================================================
                   SPOTIFY
                ================================================= */

                if (
                    data.listening_to_spotify &&
                    data.spotify
                ) {

                    const spotify =
                        data.spotify;


                    activity.className =
                        "activity";


                    activity.innerHTML = `

                        <img
                            class="activity-art"
                            src="${escapeHTML(
                                spotify.album_art_url
                            )}"
                            alt=""
                        >

                        <div class="activity-info">

                            <div class="activity-type">
                                🎵 Listening on Spotify
                            </div>

                            <div class="activity-title">
                                ${escapeHTML(
                                    spotify.song
                                )}
                            </div>

                            <div class="activity-details">
                                ${escapeHTML(
                                    spotify.artist
                                )}
                            </div>

                        </div>

                    `;


                    return;

                }


                /* =================================================
                   DISCORD GAME ACTIVITY
                ================================================= */

                if (
                    data.activities &&
                    data.activities.length
                ) {

                    const game =
                        data.activities.find(
                            item =>
                                item.type !== 4
                        );


                    if (game) {

                        activity.className =
                            "activity";


                        activity.innerHTML = `

                            <div
                                class="activity-art"
                                style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    font-size:20px;
                                "
                            >
                                🎮
                            </div>

                            <div class="activity-info">

                                <div class="activity-type">
                                    🎮 Playing
                                </div>

                                <div class="activity-title">
                                    ${escapeHTML(
                                        game.name ||
                                        "A game"
                                    )}
                                </div>

                                <div class="activity-details">
                                    ${escapeHTML(
                                        game.details ||
                                        game.state ||
                                        ""
                                    )}
                                </div>

                            </div>

                        `;


                        return;

                    }

                }


                /* =================================================
                   NOTHING ACTIVE
                ================================================= */

                activity.className =
                    "activity activity-empty";

                activity.textContent =
                    "No activity right now";


            } catch (error) {

                console.error(
                    "Lanyard error:",
                    error
                );


                activity.className =
                    "activity activity-empty";

                activity.textContent =
                    "Activity unavailable";

            }

        }


        /* =====================================================
           HTML ESCAPING
        ===================================================== */

        function escapeHTML(value) {

            if (!value) {
                return "";
            }

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        /* =====================================================
           ADMIN PLACEHOLDER
        ===================================================== */

        function toggleAdmin() {

            const message =
                document.getElementById(
                    "adminMessage"
                );


            message.classList.toggle(
                "show"
            );

        }


        /* =====================================================
           START LANYARD
        ===================================================== */

        loadActivity();


        /*
         * Refresh Discord activity
         * every 15 seconds.
         */

        setInterval(
            loadActivity,
            15000
        );

    </script>

</body>
</html>
