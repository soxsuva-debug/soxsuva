    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #ffffff;
            --card: rgba(10, 10, 10, 0.72);
            --border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --muted: #a7a7a7;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: #050505;
        }

        body {
            overflow-x: hidden;
        }

        /* BACKGROUND */

        .background {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.48),
                    rgba(0, 0, 0, 0.82)
                ),
                url("banner.gif") center / cover no-repeat;
            filter: blur(2px);
            transform: scale(1.03);
        }

        .background-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.04),
                    rgba(0,0,0,0.7)
                );
            pointer-events: none;
        }

        /* PAGE */

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .profile-card {
            width: min(520px, 100%);
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 20px 80px rgba(0,0,0,0.55),
                inset 0 1px rgba(255,255,255,0.05);
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* PROFILE */

        .profile {
            text-align: center;
        }

        .pfp {
            width: 115px;
            height: 115px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.85);
            box-shadow: 0 0 35px rgba(255,255,255,0.12);
            margin-bottom: 15px;
        }

        .name {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .handle {
            margin-top: 5px;
            color: var(--muted);
            font-size: 14px;
        }

        .bio {
            margin: 18px auto 0;
            max-width: 390px;
            color: #d2d2d2;
            font-size: 14px;
            line-height: 1.5;
        }

        /* SOCIALS */

        .socials {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .social {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.05);
            font-size: 13px;
            transition: 0.2s ease;
        }

        .social:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.25);
        }

        .icon {
            font-size: 16px;
        }

        /* STATS */

        .stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-weight: 700;
            font-size: 17px;
        }

        .stat-label {
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* ACTIVITY */

        .section {
            margin-top: 25px;
        }

        .section-title {
            color: #aaa;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .activity {
            min-height: 65px;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: rgba(255,255,255,0.035);
        }

        .activity-art {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            background: rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .activity-info {
            min-width: 0;
            flex: 1;
        }

        .activity-type {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 4px;
        }

        .activity-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .activity-details {
            margin-top: 3px;
            color: #aaa;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .offline {
            justify-content: center;
            color: var(--muted);
            font-size: 13px;
        }

        /* MUSIC */

        .music {
            margin-top: 25px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: rgba(255,255,255,0.035);
        }

        .music-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .music-title {
            font-size: 13px;
            font-weight: 700;
        }

        .music-status {
            color: var(--muted);
            font-size: 11px;
        }

        audio {
            width: 100%;
            height: 35px;
        }

        /* COUNTERS */

        .counters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .counter {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255,255,255,0.035);
            color: #aaa;
            font-size: 12px;
        }

        .counter strong {
            color: white;
        }

        /* ADMIN */

        .admin-button {
            display: block;
            margin: 25px auto 0;
            padding: 8px 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: transparent;
            color: #777;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }

        .admin-button:hover {
            color: white;
            border-color: rgba(255,255,255,0.3);
        }

        .admin-panel {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(0,0,0,0.4);
        }

        .admin-panel.visible {
            display: block;
        }

        .admin-panel p {
            color: #999;
            font-size: 12px;
            line-height: 1.5;
        }

        /* MOBILE */

        @media (max-width: 500px) {
            .page {
                padding: 15px;
            }

            .profile-card {
                padding: 23px 18px;
                border-radius: 20px;
            }

            .pfp {
                width: 100px;
                height: 100px;
            }

            .name {
                font-size: 27px;
            }

            .stats {
                gap: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="background-overlay"></div>

    <main class="page">

        <section class="profile-card">

            <!-- PROFILE -->

            <div class="profile">

                <img
                    class="pfp"
                    src="pfp.jpeg"
                    alt="soxsuva profile picture"
                >

                <h1 class="name">soxsuva</h1>

                <div class="handle">@soxsuva</div>

                <p class="bio">
                    welcome to my profile
                </p>

            </div>

            <!-- SOCIALS -->

            <div class="socials">

                <a
                    class="social"
                    href="https://www.tiktok.com/@not.p1nk"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">♪</span>
                    TikTok
                </a>

                <a
                    class="social"
                    href="https://www.roblox.com/users/2807349866/profile"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">▣</span>
                    Roblox
                </a>

                <a
                    class="social"
                    href="https://open.spotify.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">♫</span>
                    Spotify
                </a>

                <a
                    class="social"
                    href="#"
                    onclick="return false;"
                >
                    <span class="icon">◉</span>

                </a>

            <!-- STATS -->

            <div class="stats">

                <div class="stat">
                    <div class="stat-number" id="tiktok-followers">—</div>
                    <div class="stat-label">Followers</div>
                </div>

                <div class="stat">
                    <div class="stat-number" id="tiktok-following">—</div>
                    <div class="stat-label">Following</div>
                </div>

                <div class="stat">
                    <div class="stat-number" id="tiktok-likes">—</div>
                    <div class="stat-label">Likes</div>
                </div>

            <div class="section">

                <div class="section-title">
                    Activity
                </div>

                <div
                    class="activity offline"
                    id="activity"
                >
                    Loading activity...
                </div>

            </div>

            <!-- MUSIC -->

            <div class="music">

                <div class="music-header">

                    <div class="music-title">
                        needy — Ariana Grande
                    </div>

                    <div class="music-status">
                        Music
                    </div>

                </div>

                <audio
                    id="music"
                    src="needy.mp3"
                    controls
                ></audio>

            </div>

            <!-- LIVE COUNTERS -->

            <div class="counters">

                <div class="counter">
                    👁 <strong id="views">—</strong> views
                </div>

                <div class="counter">

                </div>

            <button
                class="admin-button"
                onclick="openAdmin()"
            >
                Admin
            </button>

                class="admin-panel"
                id="adminPanel"
            >
                <p>
                    Admin controls will be connected to the secure
                    backend/database in the next step.
                </p>
            </div>

        </section>

    </main>

    <script>

        /*
         * ==========================================================
         * SOXSUVA WEBSITE
         * ==========================================================
         *
         * Discord:
         * 1491533148914450614
         *
         * Lanyard endpoint:
         * https://api.lanyard.rest/v1/users/1491533148914450614
         *
         * ==========================================================
         */

        const DISCORD_ID = "1491533148914450614";

        /*
         * LANYARD ACTIVITY
         */

        async function loadDiscordActivity() {

            const activityElement =
                document.getElementById("activity");

            try {

                const response = await fetch(
                    `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
                );

                if (!response.ok) {
                    throw new Error("Lanyard request failed");
                }

                const result = await response.json();

                if (!result.success || !result.data) {
                    throw new Error("No Discord data");
                }

                const data = result.data;

                /*
                 * Spotify
                 */

                if (data.listening_to_spotify && data.spotify) {

                    const spotify = data.spotify;

                    activityElement.className = "activity";

                    activityElement.innerHTML = `
                        <img
                            class="activity-art"
                            src="${escapeHTML(spotify.album_art_url)}"
                            alt="Spotify album artwork"
                        >

                        <div class="activity-info">

                            <div class="activity-type">
                                🎵 Listening on Spotify
                            </div>

                            <div class="activity-title">
                                ${escapeHTML(spotify.song)}
                            </div>

                            <div class="activity-details">
                                ${escapeHTML(spotify.artist)}
                            </div>

                        </div>
                    `;

                    return;
                }

                /*
                 * Other Discord activities
                 */

                if (data.activities && data.activities.length > 0) {

                    const activity =
                        data.activities.find(
                            item => item.type !== 4
                        ) || data.activities[0];

                    if (activity) {

                        activityElement.className = "activity";

                        let image = "";

                        if (activity.assets) {

                            if (activity.assets.large_image) {

                                if (
                                    activity.assets.large_image
                                    .startsWith("mp:")
                                ) {

                                    image =
                                        activity.assets.large_image
                                            .replace("mp:", "");

                                } else if (
                                    activity.application_id
                                ) {

                                    image =
                                        `https://cdn.discordapp.com/app-assets/${activity.application_id}/${activity.assets.large_image}.png`;
                                }
                            }
                        }

                        activityElement.innerHTML = `

                            ${
                                image
                                ? `<img
                                    class="activity-art"
                                    src="${escapeHTML(image)}"
                                    alt=""
                                >`
                                : ""
                            }

                            <div class="activity-info">

                                <div class="activity-type">
                                    🎮 Playing
                                </div>

                                <div class="activity-title">
                                    ${escapeHTML(activity.name || "A game")}
                                </div>

                                <div class="activity-details">
                                    ${
                                        escapeHTML(
                                            activity.details ||
                                            activity.state ||
                                            ""
                                        )
                                    }
                                </div>

                            </div>
                        `;

                        return;
                    }
                }

                /*
                 * Nothing happening
                 */

                activityElement.className =
                    "activity offline";

                activityElement.textContent =
                    "Not currently doing anything";

            } catch (error) {

                console.error(
                    "Lanyard error:",
                    error
                );

                activityElement.className =
                    "activity offline";

                activityElement.textContent =
                    "Activity unavailable";
            }
        }


        /*
         * BASIC HTML ESCAPING
         */

        function escapeHTML(value) {

            if (!value) return "";

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        /*
         * ADMIN PANEL
         *
         * This is intentionally NOT a real password system.
         * Do not put a real admin password into frontend JS.
         */

        function openAdmin() {

            const panel =
                document.getElementById("adminPanel");

            panel.classList.toggle("visible");

        }


        /*
         * INITIAL LOAD
         */

        loadDiscordActivity();

        /*
         * Refresh Discord activity every 15 seconds.
         */

        setInterval(
            loadDiscordActivity,
            15000
        );

    </script>

</body>
</html>
