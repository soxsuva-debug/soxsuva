/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;

/* =========================================================
   ENTRANCE SCREEN
========================================================= */

#enterScreen {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    overflow: hidden;

    background: #000;

    transition:
        opacity 0.9s ease,
        visibility 0.9s ease;
}


/*
   This is the BIG entrance banner.
   It starts covering the entire screen.
*/

#enterBanner {

    position: absolute;

    inset: -5%;

    width: 110%;
    height: 110%;

    object-fit: cover;

    z-index: 0;

    transform:
        scale(1);

    filter:
        brightness(0.55);

    will-change:
        transform;

}


/*
   Dark overlay.
*/

.enter-overlay {

    position: absolute;

    inset: 0;

    z-index: 1;

    background:
        linear-gradient(
            rgba(0,0,0,0.18),
            rgba(0,0,0,0.72)
        );

    pointer-events: none;
}


/*
   Extra vignette.
*/

.enter-vignette {

    position: absolute;

    inset: 0;

    z-index: 2;

    background:
        radial-gradient(
            circle at center,
            transparent 0%,
            rgba(0,0,0,0.15) 45%,
            rgba(0,0,0,0.65) 100%

    pointer-events: none;
}


/* =========================================================
   ENTRANCE CONTENT
========================================================= */

.enter-content {

    z-index: 5;

    flex-direction: column;

    align-items: center;

    text-align: center;

    will-change:
        transform,
        opacity;
}


/*
   Entrance PFP.
*/

#enterPfp {

    height: 150px;

    object-fit: cover;

    border-radius: 50%;

    border:
        3px solid

    box-shadow:

        0 0 35px
        rgba(255,255,255,0.22),

        0 0 100px
        rgba(255,255,255,0.08);

    margin-bottom: 20px;

    will-change:
        transform;
}


/*
   Entrance name.
*/

.enter-name {

    letter-spacing: -4px;

        0 0 70px

}


/*
   Click text.
*/

.enter-text {

    font-size: 13px;

    letter-spacing: 2px;

    animation:
        pulseText
        2s
        ease-in-out
        infinite;
}

@keyframes pulseText {

    0%,
    100% {
        opacity: 0.5;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   MAIN BACKGROUND
========================================================= */

.background {

    z-index: -10;

    background:

            rgba(0,0,0,0.87)

}


.background-overlay {

    background:

/* =========================================================

.page {

/* =========================================================
   MAIN CARD
========================================================= */

.card {

    width:

    overflow: hidden;

    border:
        1px solid

    border-radius: 25px;

    background:

@keyframes cardAppear {

    from {

<script>


/* =========================================================
   DISCORD / LANYARD
========================================================= */

const DISCORD_ID =
    "1491533148914450614";



/* =========================================================
   ELEMENTS
========================================================= */

const enterScreen =
    document.getElementById(
        "enterScreen"
    );


const enterBanner =
    document.getElementById(
        "enterBanner"
    );


const enterPfp =
    document.getElementById(
        "enterPfp"
    );


const mainBanner =
    document.getElementById(
        "mainBanner"
    );


const profilePfp =
    document.getElementById(
        "profilePfp"
    );


const music =
    document.getElementById(
        "music"
    );


const musicStatus =
    document.getElementById(
        "musicStatus"
    );



/* =========================================================
   THE TUFF PART
   PFP + BANNER TRANSITION
========================================================= */

enterScreen.addEventListener(
    "click",
    async function() {


        /*
         * Start music because this click
         * gives the browser permission.
         */

        try {

            await music.play();

            musicStatus.textContent =
                "Playing";

        }

        catch (error) {

            console.log(
                "Music autoplay blocked:",
                error
            );

            musicStatus.textContent =
                "Click play";

        }



        /*
         * Stop the little floating animation.
         */

        const enterContent =
            document.querySelector(
                ".enter-content"
            );


        enterContent.style.animation =
            "none";



        /*
         * Get exact PFP locations.
         */

        const startPfp =
            enterPfp.getBoundingClientRect();


        const endPfp =
            profilePfp.getBoundingClientRect();



        /*
         * Calculate PFP centers.
         */

        const startPfpX =
            startPfp.left +
            startPfp.width / 2;


        const startPfpY =
            startPfp.top +
            startPfp.height / 2;


        const endPfpX =
            endPfp.left +
            endPfp.width / 2;


        const endPfpY =
            endPfp.top +
            endPfp.height / 2;



        /*
         * Calculate movement.
         */

        const pfpMoveX =
            endPfpX -
            startPfpX;


        const pfpMoveY =
            endPfpY -
            startPfpY;



        /*
         * Calculate size change.
         */

        const pfpScale =
            endPfp.width /
            startPfp.width;



        /*
         * Hide the real PFP while
         * the entrance PFP flies into it.
         */

        profilePfp.style.opacity =
            "0";



        /*
         * Get the actual main banner
         * position.
         */

        const startBanner =
            enterBanner.getBoundingClientRect();


        const endBanner =
            mainBanner.getBoundingClientRect();



        /*
         * Calculate banner centers.
         */

        const startBannerX =
            startBanner.left +
            startBanner.width / 2;


        const startBannerY =
            startBanner.top +
            startBanner.height / 2;


        const endBannerX =
            endBanner.left +
            endBanner.width / 2;


        const endBannerY =
            endBanner.top +
            endBanner.height / 2;



        /*
         * Banner movement.
         */

        const bannerMoveX =
            endBannerX -
            startBannerX;


        const bannerMoveY =
            endBannerY -
            startBannerY;



        /*
         * Banner scale.
         */

        const bannerScaleX =
            endBanner.width /
            startBanner.width;


        const bannerScaleY =
            endBanner.height /
            startBanner.height;



        /*
         * Fade out the text.
         */

        const enterName =
            document.querySelector(
                ".enter-name"
            );


        const enterText =
            document.querySelector(
                ".enter-text"
            );


        enterName.style.transition =
            "opacity 0.35s ease";


        enterText.style.transition =
            "opacity 0.3s ease";


        enterName.style.opacity =
            "0";


        enterText.style.opacity =
            "0";



        /*
         * =================================================
         * BANNER ZOOM OUT
         * =================================================
         *
         * It starts HUGE.
         *
         * Then shrinks into the actual
         * banner at the top of the card.
         */

        enterBanner.style.transition =
            "transform 1.15s cubic-bezier(.16,1,.3,1)";


        enterBanner.style.transformOrigin =
            "center center";


        enterBanner.style.transform =
            `
            translate(
                ${bannerMoveX}px,
                ${bannerMoveY}px
            )
            scale(
                ${Math.min(
                    bannerScaleX,
                    bannerScaleY
                )}
            )
            `;



        /*
         * =================================================
         * PFP FLY-IN
         * =================================================
         */

        enterPfp.style.transition =
            "transform 1.05s cubic-bezier(.16,1,.3,1)";


        enterPfp.style.transform =
            `
            translate(
                ${pfpMoveX}px,
                ${pfpMoveY}px
            )
            scale(
                ${pfpScale}
            )
            `;



        /*
         * Make the enter text disappear.
         */

        setTimeout(
            () => {

                enterContent.style.opacity =
                    "0";

            },
            350
        );



        /*
         * Fade out the entrance overlay
         * after the banner has started
         * landing in place.
         */

        setTimeout(
            () => {

                enterScreen.style.opacity =
                    "0";

            },
            780
        );



        /*
         * Reveal the real PFP.
         */

        setTimeout(
            () => {

                profilePfp.style.transition =
                    "opacity 0.2s ease";


                profilePfp.style.opacity =
                    "1";

            },
            950
        );



        /*
         * Remove the entrance screen.
         */

        setTimeout(
            () => {

                enterScreen.style.visibility =
                    "hidden";


                enterScreen.style.pointerEvents =
                    "none";

            },
            1250
        );

    }
);



/* =========================================================
   LANYARD ACTIVITY
========================================================= */

async function loadActivity() {


    const activity =
        document.getElementById(
            "activity"
        );


    try {


        const response =
            await fetch(
                `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.data
        ) {

            throw new Error(
                "No Lanyard data"
            );

        }


        const data =
            result.data;



        /*
         * SPOTIFY
         */

        if (
            data.listening_to_spotify &&
            data.spotify
        ) {


            const spotify =
                data.spotify;


            activity.className =
                "activity";


            activity.innerHTML = `

                <img
                    class="activity-art"
                    src="${escapeHTML(
                        spotify.album_art_url
                    )}"
                    alt=""
                >


                <div
                    class="activity-info"
                >

                    <div
                        class="activity-type"
                    >
                        🎵 Listening on Spotify
                    </div>


                    <div
                        class="activity-title"
                    >
                        ${escapeHTML(
                            spotify.song
                        )}
                    </div>


                    <div
                        class="activity-details"
                    >
                        ${escapeHTML(
                            spotify.artist
                        )}
                    </div>

                </div>

            `;


            return;

        }



        /*
         * GAME
         */

        if (
            data.activities &&
            data.activities.length
        ) {


            const game =
                data.activities.find(
                    item =>
                        item.type !== 4
                );


            if (game) {


                activity.className =
                    "activity";


                activity.innerHTML = `

                    <div
                        class="activity-art"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:20px;
                        "
                    >
                        🎮
                    </div>


                    <div
                        class="activity-info"
                    >

                        <div
                            class="activity-type"
                        >
                            🎮 Playing
                        </div>


                        <div
                            class="activity-title"
                        >
                            ${escapeHTML(
                                game.name ||
                                "A game"
                            )}
                        </div>


                        <div
                            class="activity-details"
                        >
                            ${escapeHTML(
                                game.details ||
                                game.state ||
                                ""
                            )}
                        </div>

                    </div>

                `;


                return;

            }

        }



        /*
         * NOTHING ACTIVE
         */

        activity.className =
            "activity activity-empty";


        activity.textContent =
            "No activity right now";


    }

    catch (error) {


        console.error(
            "Lanyard error:",
            error
        );


        activity.className =
            "activity activity-empty";


        activity.textContent =
            "Activity unavailable";

    }

}



/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    if (!value) {
        return "";
    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =========================================================
   ADMIN PLACEHOLDER
========================================================= */

function toggleAdmin() {

    const message =
        document.getElementById(
            "adminMessage"
        );


    message.classList.toggle(
        "show"
    );

}



/* =========================================================
   START ACTIVITY
========================================================= */

loadActivity();


/*
 * Refresh every 15 seconds.
 */

setInterval(
    loadActivity,
    15000
);


</script>
