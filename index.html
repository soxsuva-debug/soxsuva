<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>soxsuva</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: -35px;
    z-index: -20;

    background:
        linear-gradient(
            rgba(0,0,0,.42),
            rgba(0,0,0,.88)
        ),
        url("banner.gif") center / cover no-repeat;

    filter: blur(16px);
    transform: scale(1.08);
}

/* =========================================================
   CHERRY BLOSSOMS
========================================================= */

.blossoms {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9000;
}

.blossom {
    position: absolute;
    top: -30px;

    width: 8px;
    height: 6px;

    background: #fff;
    border-radius: 70% 30% 70% 30%;
    opacity: .72;

    box-shadow:
        0 0 7px rgba(255,255,255,.5);

    animation:
        blossomFall
        var(--fall-time)
        linear
        var(--delay)
        infinite;

    will-change: transform;
}

@keyframes blossomFall {

    0% {
        transform:
            translate3d(0,-30px,0)
            rotate(0deg);
    }

    25% {
        transform:
            translate3d(var(--x1),25vh,0)
            rotate(90deg);
    }

    50% {
        transform:
            translate3d(var(--x2),50vh,0)
            rotate(180deg);
    }

    75% {
        transform:
            translate3d(var(--x3),75vh,0)
            rotate(270deg);
    }

    100% {
        transform:
            translate3d(var(--x4),110vh,0)
            rotate(360deg);
    }
}

/* =========================================================
   CLICK TO ENTER
========================================================= */

#enterScreen {
    position: fixed;
    inset: 0;

    z-index: 100000;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    cursor: pointer;

    background: transparent;

    opacity: 1;

    transition:
        opacity 500ms cubic-bezier(.16,1,.3,1);

    will-change: opacity;
}

#enterScreen.entering {
    pointer-events: none;
}

#enterBanner {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    filter: brightness(.58);

    transform: scale(1.01);

    transition:
        transform 1000ms cubic-bezier(.16,1,.3,1),
        filter 1000ms ease,
        opacity 500ms ease;

    will-change: transform, opacity;
}

.enter-dark {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.72)
        );

    transition:
        opacity 600ms ease;
}

.enter-vignette {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle,
            transparent 10%,
            rgba(0,0,0,.78) 100%
        );

    transition:
        opacity 600ms ease;
}

.enter-content {
    position: relative;
    z-index: 5;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    transition:
        opacity 350ms ease,
        transform 700ms cubic-bezier(.16,1,.3,1);

    will-change: transform, opacity;
}

#enterPfp {
    display: block;

    width: 145px;
    height: 145px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,.95);

    box-shadow:
        0 0 35px rgba(255,255,255,.24),
        0 0 100px rgba(255,255,255,.08);

    animation: pfpPulseAnimation 3s ease-in-out infinite;

    transition:
        opacity 250ms ease;
}

@keyframes pfpPulseAnimation {
    0%, 100% {
        transform: scale(1);
        box-shadow:
            0 0 35px rgba(255,255,255,.24),
            0 0 100px rgba(255,255,255,.08);
        border-color: rgba(255,255,255,.95);
    }

    50% {
        transform: scale(1.06);
        box-shadow:
            0 0 50px rgba(255,255,255,.5),
            0 0 130px rgba(255,255,255,.2);
        border-color: rgba(255,255,255,1);
    }
}

.enter-name {
    margin-top: 20px;

    font-size:
        clamp(50px, 9vw, 82px);

    font-weight: 900;

    letter-spacing: -4px;

    text-shadow:
        0 0 30px rgba(255,255,255,.2);

    transition:
        opacity 350ms ease,
        transform 500ms cubic-bezier(.16,1,.3,1);
}

.enter-text {
    margin-top: 12px;

    font-size: 10px;

    letter-spacing: 3px;

    color: rgba(255,255,255,.62);

    animation:
        enterPulse
        2s
        ease-in-out
        infinite;

    transition:
        opacity 300ms ease,
        transform 400ms ease;
}

@keyframes enterPulse {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }
}

/* =========================================================
   FLYING PFP
========================================================= */

.pfp-flyer {
    position: fixed;

    z-index: 100001;

    margin: 0;

    object-fit: cover;

    border-radius: 50%;

    pointer-events: none;

    will-change: transform, width, height, box-shadow;

    transform-origin: center center;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    image-rendering: auto;

    transition:
        transform 1050ms cubic-bezier(.16,1,.3,1),
        border-radius 1050ms cubic-bezier(.16,1,.3,1),
        box-shadow 1050ms cubic-bezier(.16,1,.3,1),
        border-width 1050ms cubic-bezier(.16,1,.3,1);

    border: 3px solid rgba(255,255,255,.95);

    box-shadow:
        0 0 35px rgba(255,255,255,.24),
        0 0 100px rgba(255,255,255,.08);
}

/* =========================================================
   MAIN PAGE
========================================================= */

.page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 14px;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 650ms cubic-bezier(.16,1,.3,1),
        visibility 0s linear 650ms;
}

.page.site-visible {
    opacity: 1;

    visibility: visible;

    transition:
        opacity 650ms cubic-bezier(.16,1,.3,1),
        visibility 0s;
}

.card {
    width: min(570px,100%);

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 27px;

    background:
        rgba(8,8,10,.70);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 35px 120px rgba(0,0,0,.75),
        inset 0 1px rgba(255,255,255,.05);
}

/* =========================================================
   MAIN BANNER
========================================================= */

.banner {
    position: relative;

    width: 100%;
    height: 200px;

    overflow: hidden;
}

#mainBanner {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.banner-shade {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            transparent 25%,
            rgba(0,0,0,.6)
        );
}

/* =========================================================
   PROFILE
========================================================= */

.profile-area {
    position: relative;

    padding:
        70px 27px 28px;
}

.profile {
    text-align: center;
}

.pfp-wrap {
    position: absolute;

    left: 50%;
    top: -62px;

    width: 124px;
    height: 124px;

    transform:
        translateX(-50%);

    z-index: 20;
}

#profilePfp {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 50%;

    border: 4px solid #111;

    background: #111;

    box-shadow:
        0 12px 35px rgba(0,0,0,.7);

    opacity: 1;
}

/* =========================================================
   DISCORD STATUS
========================================================= */

.discord-status {
    position: absolute;

    right: 2px;
    bottom: 2px;

    width: 31px;
    height: 31px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #111;

    box-shadow:
        0 0 0 3px #111;
}

.discord-status::after {
    content: "";

    width: 17px;
    height: 17px;

    border-radius: 50%;

    background: #747f8d;
}

.discord-status.online::after {
    background: #23a55a;
}

.discord-status.idle::after {
    background: #f0b232;
}

.discord-status.dnd::after {
    width: 17px;
    height: 17px;

    background: #ed4245;
}

.discord-status.dnd::before {
    content: "";

    position: absolute;

    width: 9px;
    height: 3px;

    border-radius: 3px;

    background: #111;
}

.discord-status.offline::after {
    background: #747f8d;
}

/* =========================================================
   PROFILE TEXT
========================================================= */

.name {
    font-size: 32px;

    font-weight: 900;

    letter-spacing: -1.5px;
}

.username {
    margin-top: 5px;

    color: rgba(255,255,255,.52);

    font-size: 13px;
}

.bio {
    max-width: 410px;

    margin:
        14px auto 0;

    color: #d0d0d0;

    font-size: 14px;

    line-height: 1.55;
}

/* =========================================================
   BADGES
========================================================= */

.badges {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    margin-top: 15px;
}

.badge {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 8px;

    background:
        rgba(255,255,255,.045);

    transition:
        transform 200ms ease,
        background 200ms ease,
        box-shadow 200ms ease;
}

.badge:hover {
    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.09);

    box-shadow:
        0 0 15px rgba(255,255,255,.1);
}

.badge svg {
    width: 18px;
    height: 18px;
}

/* =========================================================
   TIKTOK
========================================================= */

.tiktok {
    display: block;

    margin-top: 24px;

    padding: 15px;

    color: #fff;

    text-decoration: none;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 17px;

    background:
        rgba(255,255,255,.035);

    transition:
        transform 250ms ease,
        border-color 250ms ease,
        background 250ms ease,
        box-shadow 250ms ease;
}

.tiktok:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(255,255,255,.4);

    background:
        rgba(255,255,255,.07);

    box-shadow:
        0 0 30px rgba(255,255,255,.1);
}

.tiktok-top {
    display: flex;
    align-items: center;

    gap: 12px;
}

.tiktok-logo {
    width: 44px;
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: #050505;

    border:
        1px solid rgba(255,255,255,.12);
}

.tiktok-logo svg {
    width: 23px;
    height: 23px;
}

.tiktok-info {
    flex: 1;
}

.tiktok-title {
    font-size: 14px;
    font-weight: 900;
}

.tiktok-handle {
    margin-top: 3px;

    color: #777;

    font-size: 11px;
}

.tiktok-arrow {
    color: #777;

    font-size: 18px;

    transition:
        transform 200ms ease,
        color 200ms ease;
}

.tiktok:hover .tiktok-arrow {
    color: #fff;

    transform:
        translateX(4px);
}

.tiktok-stats {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    margin-top: 14px;

    padding-top: 14px;

    border-top:
        1px solid rgba(255,255,255,.1);
}

.stat {
    text-align: center;
}

.stat-number {
    font-size: 16px;

    font-weight: 900;
}

.stat-label {
    margin-top: 4px;

    color: #777;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

/* =========================================================
   SECTIONS
========================================================= */

.section-title {
    margin:
        25px 0 10px;

    color: #777;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1.7px;

    text-transform: uppercase;
}

/* =========================================================
   ACTIVITY
========================================================= */

.activity {
    display: flex;
    align-items: center;

    gap: 12px;

    min-height: 72px;

    padding: 12px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 16px;

    background:
        rgba(255,255,255,.035);

    transition:
        border-color 250ms ease,
        box-shadow 250ms ease;
}

.activity:hover {
    border-color:
        rgba(255,255,255,.28);

    box-shadow:
        0 0 25px rgba(255,255,255,.06);
}

.activity-art {
    width: 49px;
    height: 49px;

    flex-shrink: 0;

    border-radius: 11px;

    object-fit: cover;

    background: #111;
}

.activity-info {
    min-width: 0;

    flex: 1;
}

.activity-type {
    margin-bottom: 4px;

    color: #777;

    font-size: 10px;
}

.activity-title {
    overflow: hidden;

    font-size: 14px;

    font-weight: 800;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.activity-details {
    margin-top: 4px;

    overflow: hidden;

    color: #999;

    font-size: 11px;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.activity-empty {
    justify-content: center;

    color: #777;

    font-size: 12px;
}

/* =========================================================
   MUSIC
========================================================= */

.music {
    padding: 16px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 18px;

    background:
        rgba(255,255,255,.035);
}

.music-top {
    display: flex;
    align-items: center;

    gap: 13px;
}

.album {
    width: 55px;
    height: 55px;

    object-fit: cover;

    border-radius: 12px;
}

.music-info {
    flex: 1;

    min-width: 0;
}

.music-title {
    font-size: 14px;

    font-weight: 900;
}

.music-artist {
    margin-top: 4px;

    color: #999;

    font-size: 11px;
}

.music-status {
    color: #777;

    font-size: 10px;
}

.music-player {
    display: flex;
    align-items: center;

    gap: 10px;

    margin-top: 14px;
}

.play-button {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;

    border-radius: 50%;

    background: #fff;

    color: #000;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;

    transition:
        transform 200ms ease,
        box-shadow 200ms ease;
}

.play-button:hover {
    transform:
        scale(1.07);

    box-shadow:
        0 0 20px rgba(255,255,255,.2);
}

.progress-area {
    flex: 1;
}

.progress {
    width: 100%;
    height: 5px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.13);

    cursor: pointer;
}

.progress-fill {
    width: 0%;
    height: 100%;

    border-radius: 20px;

    background: #fff;
}

.time {
    display: flex;
    justify-content: space-between;

    margin-top: 6px;

    color: #666;

    font-size: 9px;
}

audio {
    display: none;
}

/* =========================================================
   SOCIALS
========================================================= */

.socials {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 9px;
}

.social {
    min-height: 88px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    color: #fff;

    text-decoration: none;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 16px;

    background:
        rgba(255,255,255,.035);

    transition:
        transform 250ms ease,
        border-color 250ms ease,
        background 250ms ease,
        box-shadow 250ms ease;
}

.social:hover {
    transform:
        translateY(-4px);

    border-color:
        rgba(255,255,255,.4);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 0 30px rgba(255,255,255,.11);
}

.social-name {
    font-size: 11px;

    font-weight: 800;
}

.social-user {
    margin-top: 5px;

    color: #777;

    font-size: 9px;
}

/* =========================================================
   COUNTERS
========================================================= */

.counters {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 20px;
}

.counter {
    padding:
        9px 13px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 11px;

    background:
        rgba(255,255,255,.035);

    color: #888;

    font-size: 10px;
}

.counter strong {
    color: #fff;
}

.like-button {
    cursor: pointer;

    font-family: inherit;

    transition:
        background 200ms ease,
        border-color 200ms ease;
}

.like-button:hover {
    background:
        rgba(255,255,255,.07);

    border-color:
        rgba(255,255,255,.3);
}

.like-button.liked {
    background:
        rgba(255,255,255,.1);

    border-color:
        rgba(255,255,255,.35);
}

.like-button:disabled {
    cursor: default;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 560px) {

    .page {
        padding: 10px;
    }

    .card {
        border-radius: 23px;
    }

    .banner {
        height: 165px;
    }

    .profile-area {
        padding:
            68px 16px 22px;
    }

    .pfp-wrap {
        width: 110px;
        height: 110px;

        top: -55px;
    }

    .discord-status {
        width: 28px;
        height: 28px;
    }

    .discord-status::after {
        width: 15px;
        height: 15px;
    }

    .name {
        font-size: 28px;
    }

    .socials {
        grid-template-columns: 1fr;
    }

    .social {
        min-height: 66px;

        flex-direction: row;

        justify-content: flex-start;

        padding: 13px;
    }

    .social-user {
        margin-top: 3px;
        margin-left: 8px;
    }
}

@media (prefers-reduced-motion: reduce) {

    .blossom {
        animation: none;
    }

    #enterPfp {
        animation: none;
    }
}
</style>

</head>

<script>

/* =========================================================
   DISCORD / LANYARD
========================================================= */

const DISCORD_ID =
    "1491533148914450614";

async function updateDiscord() {

    try {

        const response =
            await fetch(
                "https://api.lanyard.rest/v1/users/" +
                DISCORD_ID
            );

        const json =
            await response.json();

        if (
            !json.success ||
            !json.data
        ) {
            throw new Error(
                "Discord unavailable"
            );
        }

        const data =
            json.data;

        const status =
            data.discord_status ||
            "offline";

        const statusElement =
            document.getElementById(
                "discordStatus"
            );

        statusElement.className =
            "discord-status " +
            status;

        statusElement.title =
            status === "dnd"
                ? "Do Not Disturb"
                : status.charAt(0).toUpperCase()
                    + status.slice(1);

        updateActivity(data);

    } catch (error) {

        const statusElement =
            document.getElementById(
                "discordStatus"
            );

        statusElement.className =
            "discord-status offline";

        statusElement.title =
            "Offline";

        const activity =
            document.getElementById(
                "activity"
            );

        activity.className =
            "activity activity-empty";

        activity.textContent =
            "No activity right now";
    }
}


/* =========================================================
   ACTIVITY
========================================================= */

function updateActivity(data) {

    const activity =
        document.getElementById(
            "activity"
        );

    const spotify =
        data.spotify;

    const activities =
        data.activities ||
        [];

    const customStatus =
        activities.find(
            a => a.type === 4
        );

    const gameActivity =
        activities.find(
            a => a.type === 0
        );

    if (spotify) {

        activity.className =
            "activity";

        const albumArt =
            spotify.album_art_url ||
            "pfp.jpeg";

        const song =
            spotify.song ||
            "Unknown Song";

        const artist =
            spotify.artist ||
            "Unknown Artist";

        activity.innerHTML = `
            <img class="activity-art" src="${albumArt}" alt="">
            <div class="activity-info">
                <div class="activity-type">Listening to Spotify</div>
                <div class="activity-title">${song}</div>
                <div class="activity-details">by ${artist}</div>
            </div>
        `;

    } else if (gameActivity) {

        activity.className =
            "activity";

        let assetUrl =
            "pfp.jpeg";

        if (
            gameActivity.assets &&
            gameActivity.assets.large_image
        ) {

            const imgId =
                gameActivity.assets.large_image;

            if (
                imgId.startsWith(
                    "spotify:"
                )
            ) {

                assetUrl =
                    "https://i.scdn.co/image/" +
                    imgId.replace(
                        "spotify:",
                        ""
                    );

            } else if (
                imgId.startsWith(
                    "mp:external/"
                )
            ) {

                assetUrl =
                    "https://media.discordapp.net/external/" +
                    imgId.replace(
                        "mp:external/",
                        ""
                    );

            } else {

                assetUrl =
                    "https://cdn.discordapp.com/app-assets/" +
                    gameActivity.application_id +
                    "/" +
                    imgId +
                    ".png";
            }
        }

        const name =
            gameActivity.name ||
            "Playing a game";

        let elapsedString = "";

        if (
            gameActivity.timestamps &&
            gameActivity.timestamps.start
        ) {

            const elapsedSeconds =
                Math.floor(
                    (Date.now() -
                    gameActivity.timestamps.start) /
                    1000
                );

            const hours =
                Math.floor(
                    elapsedSeconds / 3600
                );

            const minutes =
                Math.floor(
                    (elapsedSeconds % 3600) / 60
                );

            const seconds =
                elapsedSeconds % 60;

            if (hours > 0) {

                elapsedString =
                    `Elapsed: ${hours}h ${minutes}m`;

            } else if (minutes > 0) {

                elapsedString =
                    `Elapsed: ${minutes}m ${seconds}s`;

            } else {

                elapsedString =
                    `Elapsed: ${seconds}s`;
            }
        }

        const details =
            gameActivity.details ||
            gameActivity.state ||
            elapsedString;

        activity.innerHTML = `
            <img class="activity-art" src="${assetUrl}" alt="">
            <div class="activity-info">
                <div class="activity-type">playing on xbox:</div>
                <div class="activity-title">${name}</div>
                <div class="activity-details">${details}</div>
            </div>
        `;

    } else if (
        customStatus &&
        customStatus.state
    ) {

        activity.className =
            "activity";

        let emojiHtml = "";

        if (
            customStatus.emoji
        ) {

            if (
                customStatus.emoji.id
            ) {

                const ext =
                    customStatus.emoji.animated
                        ? "gif"
                        : "png";

                emojiHtml =
                    `<img src="https://cdn.discordapp.com/emojis/${customStatus.emoji.id}.${ext}?size=48" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;">`;

            } else if (
                customStatus.emoji.name
            ) {

                emojiHtml =
                    customStatus.emoji.name +
                    " ";
            }
        }

        activity.innerHTML = `
            <div style="flex:1;min-width:0;">
                <div class="activity-type">Custom Status</div>
                <div class="activity-title" style="font-weight:normal;">${emojiHtml}${customStatus.state}</div>
            </div>
        `;

    } else {

        activity.className =
            "activity activity-empty";

        activity.textContent =
            "No activity right now";
    }
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const musicStatus =
    document.getElementById("musicStatus");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTimeEl =
    document.getElementById("currentTime");

const durationEl =
    document.getElementById("duration");

function formatTime(seconds) {

    const mins =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    return (
        mins +
        ":" +
        (secs < 10 ? "0" : "") +
        secs
    );
}

audio.addEventListener(
    "loadedmetadata",
    () => {

        durationEl.textContent =
            formatTime(
                audio.duration
            );
    }
);

playButton.addEventListener(
    "click",
    () => {

        if (audio.paused) {

            audio.play();

            playButton.textContent =
                "❚❚";

            musicStatus.textContent =
                "Playing";

        } else {

            audio.pause();

            playButton.textContent =
                "▶";

            musicStatus.textContent =
                "Paused";
        }
    }
);

audio.addEventListener(
    "timeupdate",
    () => {

        if (audio.duration) {

            const percent =
                (audio.currentTime /
                    audio.duration) *
                100;

            progressFill.style.width =
                percent + "%";

            currentTimeEl.textContent =
                formatTime(
                    audio.currentTime
                );
        }
    }
);

progress.addEventListener(
    "click",
    (e) => {

        if (audio.duration) {

            const rect =
                progress.getBoundingClientRect();

            const pos =
                (e.clientX - rect.left) /
                rect.width;

            audio.currentTime =
                pos * audio.duration;
        }
    }
);


/* =========================================================
   COUNTERS
========================================================= */

/*
   The old code used localStorage values from previous
   versions of the site. That is why some devices could
   show huge/random numbers.

   This version starts from the requested baseline.
*/

const viewsEl =
    document.getElementById("views");

const likesEl =
    document.getElementById("likes");

const likeButton =
    document.getElementById("likeButton");

const VIEW_KEY =
    "soxsuva_site_views_v2";

const LIKE_KEY =
    "soxsuva_site_likes_v2";

const LIKED_KEY =
    "soxsuva_site_liked_v2";

/*
   Start at 3 views and 1 like on a fresh browser.
   Existing old counter keys are intentionally ignored.
*/

let storedViews =
    localStorage.getItem(VIEW_KEY);

let storedLikes =
    localStorage.getItem(LIKE_KEY);

let currentViews =
    storedViews === null
        ? 3
        : Math.max(
            3,
            parseInt(
                storedViews,
                10
            ) || 3
        );

let currentLikes =
    storedLikes === null
        ? 1
        : Math.max(
            1,
            parseInt(
                storedLikes,
                10
            ) || 1
        );

localStorage.setItem(
    VIEW_KEY,
    currentViews
);

localStorage.setItem(
    LIKE_KEY,
    currentLikes
);

viewsEl.textContent =
    currentViews;

likesEl.textContent =
    currentLikes;

if (
    localStorage.getItem(
        LIKED_KEY
    ) === "true"
) {

    likeButton.classList.add(
        "liked"
    );
}


/* =========================================================
   LIKE BUTTON
========================================================= */

likeButton.addEventListener(
    "click",
    () => {

        if (
            localStorage.getItem(
                LIKED_KEY
            ) !== "true"
        ) {

            currentLikes++;

            likesEl.textContent =
                currentLikes;

            localStorage.setItem(
                LIKE_KEY,
                currentLikes
            );

            localStorage.setItem(
                LIKED_KEY,
                "true"
            );

            likeButton.classList.add(
                "liked"
            );
        }
    }
);


/* =========================================================
   CLICK TO ENTER
========================================================= */

const enterScreen =
    document.getElementById(
        "enterScreen"
    );

const mainPage =
    document.getElementById(
        "mainPage"
    );

const enterPfp =
    document.getElementById(
        "enterPfp"
    );

const profilePfp =
    document.getElementById(
        "profilePfp"
    );

let entered = false;


/*
   Preload the profile image so the browser does not
   pause during the animation.
*/

const preloadProfile =
    new Image();

preloadProfile.src =
    profilePfp.src;


/*
   Keep the main page rendered behind the enter screen.
   This prevents the black-screen flash.
*/

requestAnimationFrame(() => {

    mainPage.classList.add(
        "site-visible"
    );

});


enterScreen.addEventListener(
    "click",
    () => {

        if (entered) return;

        entered = true;

        enterScreen.classList.add(
            "entering"
        );


        /* ==============================================
           VIEW COUNTER
        ============================================== */

        currentViews++;

        viewsEl.textContent =
            currentViews;

        localStorage.setItem(
            VIEW_KEY,
            currentViews
        );


        /* ==============================================
           MUSIC
        ============================================== */

        audio.play()
            .then(() => {

                playButton.textContent =
                    "❚❚";

                musicStatus.textContent =
                    "Playing";

            })
            .catch(() => {});


        /* ==============================================
           PFP ANIMATION
        ============================================== */

        const enterRect =
            enterPfp.getBoundingClientRect();

        const profileRect =
            profilePfp.getBoundingClientRect();


        /*
           The flyer keeps its original size and uses
           ONE GPU-accelerated transform for movement
           + scaling.

           This is considerably smoother than animating
           left/top/width/height independently.
        */

        const startCenterX =
            enterRect.left +
            enterRect.width / 2;

        const startCenterY =
            enterRect.top +
            enterRect.height / 2;

        const endCenterX =
            profileRect.left +
            profileRect.width / 2;

        const endCenterY =
            profileRect.top +
            profileRect.height / 2;

        const moveX =
            endCenterX -
            startCenterX;

        const moveY =
            endCenterY -
            startCenterY;

        const scaleX =
            profileRect.width /
            enterRect.width;

        const scaleY =
            profileRect.height /
            enterRect.height;

        const flyer =
            document.createElement("img");

        flyer.src =
            enterPfp.currentSrc ||
            enterPfp.src;

        flyer.className =
            "pfp-flyer";

        flyer.style.left =
            enterRect.left + "px";

        flyer.style.top =
            enterRect.top + "px";

        flyer.style.width =
            enterRect.width + "px";

        flyer.style.height =
            enterRect.height + "px";

        flyer.style.transform =
            "translate3d(0,0,0) scale(1)";

        document.body.appendChild(
            flyer
        );


        /*
           Hide the original enter PFP and text
           smoothly while the flyer takes over.
        */

        enterPfp.style.opacity =
            "0";

        const enterContent =
            document.querySelector(
                ".enter-content"
            );

        enterContent.style.opacity =
            "0";

        enterContent.style.transform =
            "translate3d(0,-18px,0) scale(.96)";


        /*
           Fade the enter background instead of
           suddenly exposing a black page.
        */

        const enterBanner =
            document.getElementById(
                "enterBanner"
            );

        const enterDark =
            document.querySelector(
                ".enter-dark"
            );

        const enterVignette =
            document.querySelector(
                ".enter-vignette"
            );

        enterBanner.style.opacity =
            "0";

        enterDark.style.opacity =
            "0";

        enterVignette.style.opacity =
            "0";


        /*
           Wait one frame so the browser registers the
           starting position before beginning the flight.
        */

        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                flyer.style.transform =
                    `translate3d(${moveX}px, ${moveY}px, 0) scale(${scaleX}, ${scaleY})`;

                flyer.style.borderRadius =
                    "50%";

                flyer.style.boxShadow =
                    "0 12px 35px rgba(0,0,0,.7)";
            });
        });


        /*
           The page is already rendered underneath,
           so there is no black flash when the enter
           screen disappears.
        */

        setTimeout(() => {

            profilePfp.style.opacity =
                "1";

            flyer.style.opacity =
                "0";

        }, 900);


        setTimeout(() => {

            if (flyer.parentNode) {
                flyer.remove();
            }

            enterScreen.remove();

        }, 1080);

    }
);


/* =========================================================
   INIT
========================================================= */

updateDiscord();

setInterval(
    updateDiscord,
    10000
);

</script>
